<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Water Control System</title>
    <link href="./src/output.css" rel="stylesheet">
    <link rel="stylesheet" href="./src/style.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body class="h-fit">
    <nav class="bg-gray-800 text-white p-4">
        <ul class="flex space-x-4">
            <img class="invert border-2 rounded-xs bg-amber-600" src="./src/logo.svg" alt="logo">
            <li class='font-semibold'>Home</li>
            <li class="font-semibold">Dashboard</li>
            <li class="font-semibold">About</li>
        </ul>
    </nav>
    <header class="flex justify-center bg-blue-400 font-bold text-white">
        <h1>Automated water level control system</h1>
    </header>
    <main class="flex flex-col  p-4 h-full">
        <h1 class="text-2xl font-bold">Manual Control</h1>
        <div class="manual flex justify-between items-center p-4 bg-gray-200 rounded-lg">
            <div class="buttons">
                <button class="bg-green-400 text-white font-bold px-5 rounded-2xl py-1"> START</button>
                <button class="bg-red-600 text-white font-bold px-5 rounded-2xl py-1">STOP</button>
            </div>
            <div class="status">
                <p class="text-green-600 font-bold">Status: Active</p>
                <p class="text-red-600 font-bold">Status: Inactive</p>
            </div>
        </div>

        <h1 class="text-2xl font-bold mt-4">Automated Monitoring</h1>
        <div class="content p-4 bg-gray-200 rounded-lg">
            <div class="grid grid-cols-3 gap-7 h-fit">
                <section class="border-2 h-fit">
                    <div class="container">
                        <div class="top flex justify-between">
                            <div class="waterlevel_title flex items-center gap-2">
                                <img class="fill-amber-300" src="./src/logo2.svg" alt="logo" srcset="">
                                <h1 class="font-bold">Water Level </h1>
                            </div>
                            <div class="stable_filling font-bold flex items-center gap-2">
                                <img src="./src/check.svg" alt="check.logo" srcset="">
                                Stable
                            </div>
                        </div>
                        <div class="middle flex relative ">
                            <div class="tank">
                                <div class="water" id="water"></div>
                            </div>
                            <div class="values absolute top-[13px] right-[25px] p-2">
                                <ul class="flex flex-col gap-11">
                                    <li>100%</li>
                                    <li>75%</li>
                                    <li>50%</li>
                                    <li>25%</li>
                                    <li>0%</li>
                                </ul>
                            </div>
                        </div>
                        <div class="level-text" id="levelText">Level:0%</div>
                    </div>
                </section>
                <section class="border-2 bg-white rounded-2xl p-5 space-y-3">
                    <div class="top-2 flex items-center gap-2 ">
                        <span class="material-symbols-outlined">settings</span>
                        <h2 class="font-bold">Manual Controls</h2>
                    </div>
                    <div class="status-manual bg-blue-100 p-4 rounded-lg mt-5 flex  items-center gap-2">
                        <p class="font-bold ">
                        <div class="circle  rounded-4xl bg-gray-400 h-[13px] w-[13px]"></div>Status: <p id="status">Stopped</p></p>
                    </div>
                    <div class="st-buttons space-x-3 flex">
                        <button
                            class="bg-black text-white  px-9 rounded-xl py-2 mt-2 flex items-center  justify-center gap-1"><span
                                class="material-symbols-outlined">play_arrow</span>Start Fill</button>
                        <button
                            class="border-1 border-gray-300  px-9 rounded-xl py-2 mt-2 flex justify-center items-center gap-1">
                            <span class="material-symbols-outlined">
                                check_box_outline_blank
                            </span>Stop Fill</button>
                    </div>
                    <button class="flex bg-red-500 w-full text-white gap-3 justify-center rounded-xl py-3 font-bold"><span class="material-symbols-outlined">
                            power_settings_new
                        </span>EMERGENCY STOP</button>
                    <hr class="mt-5">
                    <button class=" w-full rounded-xl py-3 border border-gray-500">Enter Maintainence Mode</button>
                    <div class="fec">
                        
                    </div>
                </section>

            </div>
        </div>
        <footer>
        </footer>
    </main>

    <script src="script.js"></script>
</body>

</html>
